openapi: 3.0.3
info:
  title: ExportFlow API
  version: 0.1.0
servers:
  - url: /api/v1
paths:
  /health:
    get:
      summary: Health
      responses:
        "200":
          description: OK
  /me:
    get:
      summary: Current session actor
      responses:
        "200": { description: OK }
        "401": { description: Unauthenticated }
  /export-cases:
    get:
      summary: List export cases
    post:
      summary: Create export case
  /export-cases/{id}:
    get:
      summary: Case overview
  /public/track/{token}:
    get:
      summary: Public tracking projection
      responses:
        "200": { description: Safe fields only }
        "410": { description: Unavailable }
